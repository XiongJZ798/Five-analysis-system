server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      force: true
  address: 0.0.0.0
  tomcat:
    # 根据测试场景(140个并发用户)设置线程池
    max-threads: 400
    min-spare-threads: 100
    max-connections: 2000
    accept-count: 500
    # 连接超时设置
    connection-timeout: 120000
    keep-alive-timeout: 60000
    max-keep-alive-requests: 1000
    # 异步处理配置
    async-timeout: 60000
    # 上传配置
    max-swallow-size: 10MB
    max-http-form-post-size: 10MB
    max-post-size: 10MB
    # 连接优化
    socket-buffer-size: 4194304
    processor-cache: 500
    # 压缩配置
    compression:
      enabled: true
      min-size: 2048
      mime-types: application/json,application/xml,text/html,text/plain,application/javascript,text/css
    # 添加字符编码
    uri-encoding: UTF-8

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:g5rate}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&connectTimeout=60000&socketTimeout=600000&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:030123}
    hikari:
      pool-name: HikariPool-G5Rate
      # 连接池配置
      maximum-pool-size: 200
      minimum-idle: 50
      idle-timeout: 300000
      connection-timeout: 60000
      validation-timeout: 10000
      max-lifetime: 1800000
      keepalive-time: 60000
      auto-commit: true
      connection-test-query: SELECT 1
      register-mbeans: true
      leak-detection-threshold: 60000
      initialization-fail-timeout: 1
      validation-interval: 30000
      # 性能优化参数
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 500
        prepStmtCacheSqlLimit: 4096
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
        useUnicode: true
        characterEncoding: utf8
        cacheCallableStmts: true
        callableStmtCacheSize: 250
        # 将64M转换为等价的字节数 (64 * 1024 * 1024 = 67108864)
        maxAllowedPacket: 67108864
        defaultFetchSize: 100
        useCursorFetch: true
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 50
          batch_versioned_data: true
          time_zone: Asia/Shanghai
        order_inserts: true
        order_updates: true
        generate_statistics: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 5MB
      location: ${java.io.tmpdir}
  mvc:
    async:
      request-timeout: 120000
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ant_path_matcher

# 添加缓存配置
cache:
  type: caffeine
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=3600s
  cache-names: analysisCache
  
# 添加线程池配置
thread-pool:
  core-pool-size: 50
  max-pool-size: 100
  queue-capacity: 1000
  keep-alive-seconds: 300
  thread-name-prefix: analysis-async-

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
    allow-credentials: true
    max-age: 3600
    exposed-headers: Authorization

logging:
  file:
    name: logs/application.log
    max-size: 100MB
    max-history: 30
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  level:
    root: INFO
    com._5ganalysisrate: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
      cors:
        allowed-origins: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    shutdown:
      enabled: false
  metrics:
    tags:
      application: g5rate-analysis
    export:
      prometheus:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 100ms,500ms,1s,5s,10s
      percentiles:
        http.server.requests: 0.5,0.75,0.9,0.95,0.99
    enable:
      jvm: true
      process: true
      system: true
      logback: true
      tomcat: true
      jdbc: true
      hibernate: true

# 添加JVM配置，在部署时使用这些参数
# java -Xmx8g -Xms4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=./logs/heap_dump.hprof -jar your-application.jar 

# JVM Configuration
jvm:
  heap:
    # 堆内存配置 - 根据实际负载调整
    xms: 2048m  # 初始堆大小
    xmx: 4096m  # 最大堆大小
    metaspace: 256m
  gc:
    # G1GC配置
    type: G1GC
    max-pause-millis: 100
    parallel-gc-threads: 4
    concurrent-gc-threads: 2
    # 添加G1特定配置
    g1-heap-region-size: 4m
    g1-reserve-percent: 10
    initiating-heap-occupancy-percent: 45
  options:
    # GC日志配置
    gc-log: true
    gc-log-file: logs/gc.log
    # 性能优化
    string-deduplication: true
    aggressive-opts: true
    # 监控配置
    print-gc-details: true
    print-gc-datetime: true
    # 内存溢出时的处理
    heap-dump-on-out-of-memory: true
    heap-dump-path: logs/heap_dump.hprof
    # 异常处理
    crash-on-out-of-memory-error: true
    error-file: logs/hs_err_pid%p.log 
# AI分析服务配置
ai:
  api:
    # AI服务地址（留空则使用模拟模式，不调用真实AI API）
    url: ${AI_API_URL:}
    # AI服务密钥
    key: ${AI_API_KEY:}
    # 使用的模型名称
    model: ${AI_API_MODEL:gpt-3.5-turbo}
    # 请求超时时间（秒）
    timeout-seconds: ${AI_API_TIMEOUT:60}
